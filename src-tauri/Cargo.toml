[package]
name = "xcloud-cyber-monitor"
version = "1.2.0"
description = "Monitor de telemetria e diagnóstico de rede para Xbox Cloud Gaming no Brasil"
authors = ["timeuz <10673085+timeuz@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/timeuz/xcloud-monitor"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
dirs = "7.0.0"
base64 = "0.23.1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
tokio = { version = "1.54.1", features = ["time"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
